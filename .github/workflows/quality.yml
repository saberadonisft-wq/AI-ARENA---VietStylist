name: Application quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: vietstylist_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: vietstylist_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vietstylist_test -d vietstylist_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -c backend/constraints.txt -e './backend[dev]'
      - run: python -m pytest backend/tests -o addopts='' -q
        env:
          TEST_POSTGRES_URL: postgresql://vietstylist_test:test_only_password@127.0.0.1:5432/vietstylist_test
      - run: python backend/scripts/export_openapi.py --check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -c ../backend/constraints.txt -e '../backend[dev]'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:public && npm run test:public
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_DIST_DIR: .next-build
          NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:4100
      - run: npm run test:integration
        env:
          TEST_PRODUCTION: '1'
