name: Application quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -c backend/constraints.txt -e './backend[dev]'
      - run: python -m pytest backend/tests -o addopts='' -q
      - run: python backend/scripts/export_openapi.py --check
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -c ../backend/constraints.txt -e '../backend[dev]'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run check:public && npm run test:public
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_DIST_DIR: .next-build
          NEXT_PUBLIC_API_ORIGIN: http://127.0.0.1:4100
      - run: npm run test:integration
        env:
          TEST_PRODUCTION: '1'
