[project]
name = "viet-phuc-remix-backend"
version = "0.1.0"
description = "Backend REST API cho web Việt phục Remix (Python FastAPI)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<0.116.0",
    "uvicorn[standard]>=0.34.0,<0.35.0",
    "pydantic>=2.10.0,<2.11.0",
    "pydantic-settings>=2.7.0,<2.8.0",
    "pyjwt[crypto]>=2.10.0,<3.0.0",
    "httpx>=0.28.0,<0.29.0",
    "boto3>=1.35.0",
    "python-multipart>=0.0.20",
    "aiofiles>=24.1.0",
    "pillow>=11.0.0",
    "rembg[cpu]>=2.0.84,<3.0.0",
    "psycopg[binary]>=3.3.4,<4.0",
    "psycopg-pool>=3.3.3,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "psutil>=6.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.package-data]
"app.data" = ["*.sql", "postgres_schema.json"]
"app.modules.cultural_data_v3" = ["fixtures/*.json", "fixtures/pilot_packages/*.json"]

[tool.setuptools.packages.find]
include = ["app*"]
